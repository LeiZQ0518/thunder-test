        <h1>关于我们的隐藏菜单</h1>
        <article class="content-box">
            <p>“干饭大学”的食堂，曾经也是一个只卖清汤寡水的地方。</p >
            <p>直到三年前，王大爷退休后来到了我们学校。他可是正宗的津菜/鲁菜传人！</p >
            <p>从那以后，二楼的 3 号窗口画风突变。别的窗口在炒大白菜，王大爷在颠勺做“罾蹦鲤鱼”和“扒牛肉条”。</p >
            <p>因为价格便宜（学校有补贴），味道又极其正宗，这里成了全校干饭人的圣地。每天中午的下课铃，就是冲锋的号角。</p >
